[package]
name        = "holyc_compiler"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true
description = "LLVM-based JIT/AOT compiler backend for HolyC"

[lib]
name = "holyc_compiler"
path = "src/lib.rs"

[[bin]]
name = "holyc-compile"
path = "src/main.rs"

[features]
# Enable the full LLVM JIT/AOT pipeline.  Requires LLVM 17 (`llvm-config`,
# headers, and a shared `libLLVM-17` on typical Linux installs, e.g.
# `apt install llvm-17-dev` on Debian/Ubuntu).  Without this feature the binary
# still parses and validates HolyC source but cannot compile to native code.
#
# `llvm17-0-prefer-dynamic`: link libLLVM-17.so first so `llvm-sys` does not
# pull every static archive (including Polly), which many distro LLVM packages
# omit — fixing "could not find native static library Polly".
jit = [
    "dep:inkwell",
    "dep:clap",
    "dep:libc",
    "inkwell/llvm17-0-prefer-dynamic",
]

[dependencies]
holyc_frontend = { workspace = true }
holyc_stdlib   = { workspace = true }
thiserror = { workspace = true }
clap    = { version = "4", features = ["derive"], optional = true }
libc    = { version = "0.2", optional = true }

[dependencies.inkwell]
version  = "0.4"
optional = true

[dev-dependencies]
libc = "0.2"
holyc_stdlib = { workspace = true }
